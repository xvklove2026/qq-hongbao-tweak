name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bootstrap: [roothide, rootless]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm libplist-dev libssl-dev dpkg-dev curl
          LIPO=$(ls /usr/bin/llvm-lipo* 2>/dev/null | head -1 || true)
          if [ -n "$LIPO" ]; then sudo ln -sf "$LIPO" /usr/local/bin/lipo; fi

      - name: Build ldid
        run: |
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          make -C /tmp/ldid -j"$(nproc)"
          sudo install -m755 /tmp/ldid/ldid /usr/local/bin/ldid

      - name: Fetch iPhoneOS SDK
        run: |
          curl -fL -o /tmp/sdk.tar.xz \
            https://github.com/theos/sdks/raw/master/iPhoneOS16.5.sdk.tar.xz
          sudo mkdir -p /opt/sdk
          sudo tar -xf /tmp/sdk.tar.xz -C /opt/sdk
          echo "SDKROOT=/opt/sdk/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"

      - name: Build tweak
        run: |
          chmod +x apelin/build.sh
          if [ "${{ matrix.bootstrap }}" = "roothide" ]; then
            PREFIX=""
            ARCH=iphoneos-arm64e
          else
            PREFIX="/var/jb"
            ARCH=iphoneos-arm64
          fi
          mkdir -p out
          export APELIN_PROJECT_ROOT="$PWD"
          export APELIN_BOOTSTRAP="${{ matrix.bootstrap }}"
          export APELIN_ARCHITECTURE="$ARCH"
          export APELIN_PREFIX="$PREFIX"
          export APELIN_BUILD_ID="${GITHUB_SHA::8}"
          export APELIN_PACKAGE_DIR="$PWD/out"
          export TMPDIR="$(mktemp -d)"
          ./apelin/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: qqhongbao-${{ matrix.bootstrap }}
          path: out/*.deb
          if-no-files-found: error
