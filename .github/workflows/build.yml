name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bootstrap: [roothide, rootless]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/build.log
          {
            sudo apt-get update
            sudo apt-get install -y clang llvm lld libplist-dev libssl-dev zlib1g-dev \
              libxml2-dev flex bison texinfo dpkg-dev llvm-dev curl libblocksruntime-dev \
              libbsd-dev libnuma-dev cmake
            LIPO=$(ls /usr/bin/llvm-lipo* 2>/dev/null | head -1 || true)
            if [ -n "$LIPO" ]; then sudo ln -sf "$LIPO" /usr/local/bin/lipo; fi
          } 2>&1 | tee -a /tmp/build.log

      - name: Build ldid
        run: |
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          make -C /tmp/ldid -j"$(nproc)"
          sudo install -m755 /tmp/ldid/ldid /usr/local/bin/ldid

      - name: Provide libdispatch
        shell: bash
        run: |
          set -o pipefail
          {
            DISPATCH_SO=$(find /usr /opt -name 'libdispatch.so*' 2>/dev/null | head -1 || true)
            if [ -n "$DISPATCH_SO" ]; then
              echo "found prebuilt: $DISPATCH_SO"
              sudo mkdir -p /usr/local/lib
              sudo cp -a "$DISPATCH_SO" /usr/local/lib/ || true
              INC=$(dirname "$(find /usr /opt -name 'dispatch.h' 2>/dev/null | head -1 || echo /nonexistent)")
              if [ -d "$INC" ]; then sudo mkdir -p /usr/local/include; sudo cp -a "$INC" /usr/local/include/dispatch || true; fi
            else
              echo "building swift-corelibs-libdispatch"
              git clone --depth 1 https://github.com/swiftlang/swift-corelibs-libdispatch.git /tmp/libdispatch
              cmake -S /tmp/libdispatch -B /tmp/libdispatch/build \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
              cmake --build /tmp/libdispatch/build -j"$(nproc)"
              sudo cmake --install /tmp/libdispatch/build
            fi
            sudo ldconfig
            ldconfig -p | grep -i dispatch || true
          } 2>&1 | tee -a /tmp/build.log

      - name: Build ld64 (cctools-port)
        shell: bash
        run: |
          set -o pipefail
          {
            git clone --depth 1 https://github.com/tpoechtrager/cctools-port.git /tmp/ctp
            cd /tmp/ctp/cctools
            LLVMCONFIG=$(command -v llvm-config-18 || command -v llvm-config-19 || command -v llvm-config)
            echo "llvm-config: $LLVMCONFIG"
            CPPFLAGS="-I/usr/local/include" LDFLAGS="-L/usr/local/lib" \
              ./configure --prefix=/usr/local --target=aarch64-apple-darwin \
                --with-llvm-config="$LLVMCONFIG"
            make -j"$(nproc)"
            sudo make install
            ls -l /usr/local/bin | head -30
          } 2>&1 | tee -a /tmp/build.log

      - name: Fetch iPhoneOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
          echo "SDKROOT=/tmp/sdks/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"

      - name: Build tweak
        shell: bash
        run: |
          set -o pipefail
          chmod +x apelin/build.sh
          if [ "${{ matrix.bootstrap }}" = "roothide" ]; then
            PREFIX=""
            ARCH=iphoneos-arm64e
          else
            PREFIX="/var/jb"
            ARCH=iphoneos-arm64
          fi
          mkdir -p out
          export APELIN_PROJECT_ROOT="$PWD"
          export APELIN_BOOTSTRAP="${{ matrix.bootstrap }}"
          export APELIN_ARCHITECTURE="$ARCH"
          export APELIN_PREFIX="$PREFIX"
          export APELIN_BUILD_ID="${GITHUB_SHA::8}"
          export APELIN_PACKAGE_DIR="$PWD/out"
          export APELIN_LD_FLAGS="--ld-path=/usr/local/bin/ld64"
          export TMPDIR="$(mktemp -d)"
          ./apelin/build.sh 2>&1 | tee -a /tmp/build.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqhongbao-${{ matrix.bootstrap }}
          path: out/*.deb
          if-no-files-found: error

      - name: Publish build log
        if: failure()
        shell: bash
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B "ci-log-${{ matrix.bootstrap }}"
          tail -c 20000 /tmp/build.log > ci-log.txt || true
          git add -f ci-log.txt
          git commit -m "ci log ${{ matrix.bootstrap }}" || true
          git push -f origin "ci-log-${{ matrix.bootstrap }}"
